name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil pywin32 pyinstaller

      - name: Build OfficeGuard Service
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name OfficeGuardService --hidden-import win32timezone service.py

      - name: Build UI
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name OfficeGuardUI ui_agent.py

      - name: Build Admin
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name OfficeGuardAdmin admin.py

      - name: Build Uninstaller
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --uac-admin --name OfficeGuardUninstall uninstall.py

      - name: Stage setup payload
        shell: cmd
        run: |
          if exist payload rmdir /s /q payload
          mkdir payload
          mkdir payload\Service
          xcopy /e /i /y "dist\OfficeGuardService\*" "payload\Service\"
          copy /y "dist\OfficeGuardUI.exe" "payload\OfficeGuardUI.exe"
          copy /y "dist\OfficeGuardAdmin.exe" "payload\OfficeGuardAdmin.exe"
          copy /y "dist\OfficeGuardUninstall.exe" "payload\OfficeGuardUninstall.exe"
          if exist alert.wav copy /y "alert.wav" "payload\alert.wav"

      - name: Build Setup
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --uac-admin --name OfficeGuardSetup --add-data "payload:payload" setup.py

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeGuardSetup
          path: dist/OfficeGuardSetup.exe
          if-no-files-found: error
